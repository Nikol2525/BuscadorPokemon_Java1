<header>
    <h2>Registro de Entrenadores</h2>
<head>
  <link rel="stylesheet" href="Css/Sytle.css">
</head>   
</header>

<div>
    <form>

        <div>
            <label for="nombre">Nombre:</label>
            <input
                type="text"
                id="nombre"
                name="nombre"
                required
                placeholder="Ej: Camilo"
            >
        </div>

        <div>
            <label for="apellido">Apellido:</label>
            <input
                type="text"
                id="apellido"
                name="apellido"
                required
                placeholder="Ej: Perez"
            >
        </div>

        <div>
            <label for="tipoDoc">Tipo de Identificación:</label>
            <select id="tipoDoc" name="tipoDoc" required>
                <option value="CC">Cédula de Ciudadanía (CC)</option>
                <option value="TI">Tarjeta de Identidad (TI)</option>
                <option value="PA">Pasaporte (PA)</option>
            </select>
        </div>

        <div>
            <label for="dni">Número de Identificación:</label>
            <input
                type="text"
                id="dni"
                name="dni"
                placeholder="Ej: 123456789"
                maxlength="12"
                required
            >
        </div>

        <div>
            <label for="fechaNacimiento">Fecha de Nacimiento:</label>
            <input
                type="date"
                id="fechaNacimiento"
                name="fecha_nacimiento"
                required
            >
        </div>

        <div>
            <label for="correo">Correo Electrónico:</label>
            <input
                type="email"
                id="correo"
                name="correo"
                placeholder="micorreo@gmail.com"
                required
            >
        </div>

        <div>
            <label for="pais">País de domicilio:</label>
            <select id="pais" name="pais" required>
                <option value="">Seleccione el país...</option>
                <option value="169">Colombia</option>
                <option value="023">Alemania</option>
                <option value="105">Brasil</option>
            </select>
        </div>

        <div>
            <label for="ciudad">Ciudad de domicilio:</label>
            <select id="ciudad" name="ciudad">

                <option value="">Seleccione la ciudad...</option>

                <optgroup label="Colombia">
                    <option value="1101">Bogotá D.C</option>
                    <option value="54001">Cúcuta</option>
                    <option value="66001">Pereira</option>
                    <option value="76001">Cali</option>
                    <option value="13001">Cartagena</option>
                </optgroup>

                <optgroup label="Alemania">
                    <option value="030">Berlin</option>
                    <option value="040">Hamburgo</option>
                    <option value="089">Munich</option>
                    <option value="0221">Colonia</option>
                    <option value="069">Francfort del Meno</option>
                </optgroup>

                <optgroup label="Brasil">
                    <option value="21">Rio de Janeiro</option>
                    <option value="61">Brasilia</option>
                    <option value="71">Salvador de la Bahía</option>
                    <option value="85">Fortaleza</option>
                    <option value="31">Belo Horizonte</option>
                </optgroup>

            </select>
        </div>

        <div>
            <input
                type="checkbox"
                id="politica_datos"
                name="politica_datos"
                required
            >

            <label for="politica_datos">
                Acepto la política de tratamiento de datos.
            </label>
        </div>

        <div>
            <button type="submit">Enviar</button>
        </div>

    </form>
</div>

<script src="Java/java.js"></script>

<div>
    <h3>Cambiar Entrenador</h3>

    <div>
        <button type="button">Camilo Torres</button>
        <button type="button">Juan Torres</button>
        <button type="button">Carlos Gómez</button>
    </div>
</div>
